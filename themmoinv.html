<script>
// Client-side validation and submission for Add Employee
function normalizeVietnamPhone(v){
  if(!v) return '';
  let s = String(v).trim();
  s = s.replace(/[^0-9+]/g,'');
  if(s.startsWith('+84')){ s = '0' + s.slice(3); }
  if(s.startsWith('84') && s.length>2){ s = '0'+s.slice(2); }
  if(!s.startsWith('0')) s = '0'+s;
  s = s.replace(/[^0-9]/g,'');
  return s;
}

document.getElementById('submitBtn').addEventListener('click', async function(){
  const manv = document.getElementById('manv').value.trim();
  const tennv = document.getElementById('tennv').value.trim();
  const chucvu = document.getElementById('chucvu').value.trim();
  const sdtRaw = document.getElementById('sdt').value.trim();
  const sdt = normalizeVietnamPhone(sdtRaw);

  if(!manv || !tennv || !chucvu || !sdt){
    alert('Vui lòng điền đầy đủ Mã NV, Họ tên, Chức vụ và Số điện thoại.');
    return;
  }

  if(!(sdt.length===10 || sdt.length===11) || !/^0\d{9,10}$/.test(sdt)){
    alert('Số điện thoại không hợp lệ. Vui lòng nhập đầu số Việt Nam (ví dụ: 0912345678 hoặc +84912345678).');
    return;
  }

  let role = 'employee';
  const cv = chucvu.toLowerCase();
  if(cv.includes('quản lý') && cv.includes('hạng mục')) role = 'category_manager';
  else if(cv.includes('quản lý')) role = 'manager';
  else if(cv.includes('nhân viên')) role = 'employee';

  const payload = { manv, name: tennv, position: chucvu, phone: sdt, role };

  try{
    const body = new URLSearchParams(payload).toString();
    const res = await fetch('/quanlytiendo/add_employee.php', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, body });
    const js = await res.json();
    if(js && js.success){
      alert(js.message || 'Thêm mới nhân viên thành công');
      document.getElementById('manv').value=''; document.getElementById('tennv').value=''; document.getElementById('chucvu').value=''; document.getElementById('sdt').value='';
      window.location.href = 'Qlynhanvien.html';
    } else {
      alert('Lỗi: ' + (js && js.error ? js.error : 'Thêm thất bại'));
    }
  }catch(e){ alert('Lỗi kết nối: '+ (e && e.message ? e.message : e)); }
});
</script>
